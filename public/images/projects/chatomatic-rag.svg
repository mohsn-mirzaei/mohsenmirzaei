<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Chatomatic two-phase streaming</title>
  <desc id="desc">Retrieve the top chunks, stream tokens to the client, then persist the citation set only after the stream closes.</desc>
  <rect width="1200" height="760" fill="#08080a"/>
  <text x="48" y="56" fill="#d6ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3.2">TWO-PHASE STREAM</text>
  <text x="48" y="98" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600">Retrieve. Stream. Then write.</text>
  <text x="48" y="132" fill="#82827c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">The client sees tokens immediately. The database only ever stores a finished answer.</text>

  <g fill="none" stroke="#d6ff3f" stroke-width="1.5" opacity="0.85">
    <path d="M392 430 H422"/>
    <path d="M778 430 H808"/>
  </g>
  <g fill="#d6ff3f">
    <path d="M422 430 l-8 -4.5 v9 z"/>
    <path d="M808 430 l-8 -4.5 v9 z"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="48" y="176" width="344" height="500" rx="16" fill="#141418" stroke="rgba(245,245,240,0.10)"/>
    <text x="72" y="214" fill="#d6ff3f" font-size="13" letter-spacing="2">01</text>
    <text x="104" y="214" fill="#ededed" font-size="15" letter-spacing="1.4">RETRIEVE</text>
    <text x="72" y="242" fill="#82827c" font-size="12">pgvector · IVFFlat · top 5</text>

    <rect x="72" y="268" width="296" height="64" rx="12" fill="#0e0e11" stroke="rgba(214,255,63,0.35)"/>
    <text x="90" y="294" fill="#ededed" font-size="14">returns.pdf · p. 1</text>
    <text x="348" y="294" fill="#d6ff3f" font-size="13" text-anchor="end">0.94</text>
    <text x="90" y="316" fill="#6f6f69" font-size="12">30-day window, tags attached</text>

    <rect x="72" y="344" width="296" height="64" rx="12" fill="#0e0e11" stroke="rgba(245,245,240,0.10)"/>
    <text x="90" y="370" fill="#ededed" font-size="14">returns.pdf · p. 3</text>
    <text x="348" y="370" fill="#ededed" font-size="13" text-anchor="end">0.86</text>
    <text x="90" y="392" fill="#6f6f69" font-size="12">refund to the original method</text>

    <rect x="72" y="420" width="296" height="64" rx="12" fill="#0e0e11" stroke="rgba(245,245,240,0.10)"/>
    <text x="90" y="446" fill="#ededed" font-size="14">exchanges.md</text>
    <text x="348" y="446" fill="#ededed" font-size="13" text-anchor="end">0.81</text>
    <text x="90" y="468" fill="#6f6f69" font-size="12">free size exchange in the EU</text>

    <text x="72" y="524" fill="#ededed" font-size="13">confidence above threshold</text>
    <text x="72" y="546" fill="#82827c" font-size="12">these chunks go to the model</text>
    <text x="72" y="584" fill="#ededed" font-size="13">confidence too low</text>
    <text x="72" y="606" fill="#82827c" font-size="12">fall back to the full context</text>
    <text x="72" y="640" fill="#6f6f69" font-size="12">small indexes skip vector search</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="434" y="176" width="344" height="500" rx="16" fill="#141418" stroke="rgba(245,245,240,0.10)"/>
    <text x="458" y="214" fill="#d6ff3f" font-size="13" letter-spacing="2">02</text>
    <text x="490" y="214" fill="#ededed" font-size="15" letter-spacing="1.4">STREAM</text>
    <text x="458" y="242" fill="#82827c" font-size="12">tokens on the wire, live</text>

    <rect x="458" y="268" width="296" height="168" rx="12" fill="#0e0e11" stroke="rgba(214,255,63,0.35)"/>
    <text x="476" y="300" fill="#ededed" font-size="14">returned within 30 days</text>
    <text x="476" y="328" fill="#ededed" font-size="14">if it’s unworn</text>
    <rect x="612" y="312" width="22" height="16" rx="8" fill="#d6ff3f"/>
    <text x="623" y="324" fill="#08080a" font-size="11" text-anchor="middle" font-weight="700">1</text>
    <text x="476" y="364" fill="#6f6f69" font-size="13">refund within 5 business days</text>
    <rect x="732" y="348" width="22" height="16" rx="8" fill="#d6ff3f"/>
    <text x="743" y="360" fill="#08080a" font-size="11" text-anchor="middle" font-weight="700">2</text>
    <text x="476" y="408" fill="#82827c" font-size="12">caret still moving</text>

    <text x="458" y="476" fill="#ededed" font-size="13">phase one, for the reader</text>
    <text x="458" y="498" fill="#82827c" font-size="12">the answer is on screen</text>
    <text x="458" y="536" fill="#ededed" font-size="13">citations are provisional</text>
    <text x="458" y="558" fill="#82827c" font-size="12">markers, not a saved set</text>
    <text x="458" y="596" fill="#ededed" font-size="13">nothing committed yet</text>
    <text x="458" y="618" fill="#82827c" font-size="12">the stream is still open</text>
    <text x="458" y="640" fill="#6f6f69" font-size="12">OpenAI or Ollama, per assistant</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="820" y="176" width="332" height="500" rx="16" fill="#141418" stroke="rgba(214,255,63,0.45)"/>
    <text x="844" y="214" fill="#d6ff3f" font-size="13" letter-spacing="2">03</text>
    <text x="876" y="214" fill="#ededed" font-size="15" letter-spacing="1.4">PERSIST</text>
    <text x="844" y="242" fill="#82827c" font-size="12">after the stream closes</text>

    <rect x="844" y="272" width="284" height="72" rx="12" fill="#0e0e11" stroke="rgba(245,245,240,0.10)"/>
    <text x="864" y="302" fill="#6f6f69" font-size="11" letter-spacing="1.2">ON FINISH</text>
    <text x="864" y="326" fill="#ededed" font-size="15">message row is complete</text>

    <rect x="844" y="360" width="284" height="132" rx="12" fill="#0e0e11" stroke="rgba(214,255,63,0.35)"/>
    <text x="864" y="390" fill="#6f6f69" font-size="11" letter-spacing="1.2">CITATION SET</text>
    <text x="864" y="418" fill="#ededed" font-size="14">[1] returns.pdf · p. 1</text>
    <text x="864" y="444" fill="#ededed" font-size="14">[2] returns.pdf · p. 3</text>
    <text x="864" y="470" fill="#ededed" font-size="14">[3] exchanges.md</text>

    <text x="844" y="532" fill="#ededed" font-size="13">one write</text>
    <text x="844" y="554" fill="#82827c" font-size="12">message and citations together</text>
    <text x="844" y="592" fill="#ededed" font-size="13">reload replaces the draft</text>
    <text x="844" y="614" fill="#82827c" font-size="12">the thread now matches the DB</text>
    <text x="844" y="640" fill="#6f6f69" font-size="12">a partial answer is never stored</text>
  </g>

  <text x="48" y="724" fill="#6f6f69" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Phase one is for the person waiting. Phase two is for the record — citations land only when the stream has closed.</text>
</svg>
