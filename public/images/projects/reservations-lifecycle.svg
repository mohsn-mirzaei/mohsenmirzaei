<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Reservation lifecycle</title>
  <desc id="desc">Eight reservation statuses. Legal transitions are drawn. Anything else is rejected before the write, and the slot row is locked inside the transaction.</desc>
  <rect width="1600" height="1000" fill="#08080a"/>

  <text x="64" y="64" fill="#d6ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3.2">RESERVATION LIFECYCLE</text>
  <text x="64" y="108" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600">Eight states. Every other edge is rejected.</text>
  <text x="64" y="144" fill="#82827c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Table mode B starts at draft. Event halls, catering, and hosted tables enter at pending review.</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#d6ff3f"/>
    </marker>
    <marker id="arrow-dim" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6f6f69"/>
    </marker>
  </defs>

  <!-- happy path -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g>
      <rect x="64" y="196" width="248" height="108" rx="16" fill="#141418" stroke="rgba(245,245,240,0.10)"/>
      <text x="84" y="232" fill="#82827c" font-size="11" letter-spacing="1.6">01</text>
      <text x="84" y="262" fill="#ededed" font-size="16" letter-spacing="0.6">DRAFT</text>
      <text x="84" y="284" fill="#6f6f69" font-size="12">table, guests invited</text>
    </g>
    <g>
      <rect x="360" y="196" width="248" height="108" rx="16" fill="#141418" stroke="rgba(245,245,240,0.10)"/>
      <text x="380" y="232" fill="#82827c" font-size="11" letter-spacing="1.6">02</text>
      <text x="380" y="262" fill="#ededed" font-size="16" letter-spacing="0.6">AWAITING ORDERS</text>
      <text x="380" y="284" fill="#6f6f69" font-size="12">guests still ordering</text>
    </g>
    <g>
      <rect x="656" y="196" width="248" height="108" rx="16" fill="#141418" stroke="rgba(214,255,63,0.55)"/>
      <text x="676" y="232" fill="#d6ff3f" font-size="11" letter-spacing="1.6">03</text>
      <text x="676" y="262" fill="#ededed" font-size="16" letter-spacing="0.6">PENDING</text>
      <text x="676" y="284" fill="#6f6f69" font-size="12">waiting on an admin</text>
    </g>
    <g>
      <rect x="952" y="196" width="248" height="108" rx="16" fill="#141418" stroke="rgba(214,255,63,0.55)"/>
      <text x="972" y="232" fill="#d6ff3f" font-size="11" letter-spacing="1.6">04</text>
      <text x="972" y="262" fill="#ededed" font-size="16" letter-spacing="0.6">CONFIRMED</text>
      <text x="972" y="284" fill="#6f6f69" font-size="12">SMS and reminders queued</text>
    </g>
    <g>
      <rect x="1248" y="196" width="288" height="108" rx="16" fill="#141418" stroke="rgba(63,214,139,0.55)"/>
      <text x="1268" y="232" fill="#3fd68b" font-size="11" letter-spacing="1.6">05</text>
      <text x="1268" y="262" fill="#ededed" font-size="16" letter-spacing="0.6">COMPLETED</text>
      <text x="1268" y="284" fill="#6f6f69" font-size="12">terminal · no way back</text>
    </g>
  </g>

  <g fill="none" stroke="#d6ff3f" stroke-width="1.5">
    <path d="M312 250 H360" marker-end="url(#arrow)"/>
    <path d="M608 250 H656" marker-end="url(#arrow)"/>
    <path d="M904 250 H952" marker-end="url(#arrow)"/>
    <path d="M1200 250 H1248" marker-end="url(#arrow)"/>
  </g>

  <!-- exits -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="64" y="430" width="360" height="132" rx="16" fill="#141418" stroke="rgba(255,94,94,0.45)"/>
    <text x="84" y="466" fill="#ff5e5e" font-size="11" letter-spacing="1.6">06</text>
    <text x="84" y="496" fill="#ededed" font-size="16">REJECTED</text>
    <text x="84" y="522" fill="#6f6f69" font-size="13">from pending · reason required</text>
    <text x="84" y="544" fill="#82827c" font-size="12">terminal</text>

    <rect x="452" y="430" width="520" height="132" rx="16" fill="#141418" stroke="rgba(255,94,94,0.35)"/>
    <text x="472" y="466" fill="#ff5e5e" font-size="11" letter-spacing="1.6">07</text>
    <text x="472" y="496" fill="#ededed" font-size="16">CANCELLED BY CUSTOMER</text>
    <text x="472" y="522" fill="#6f6f69" font-size="13">from pending or confirmed</text>
    <text x="472" y="544" fill="#82827c" font-size="12">draft and awaiting orders cannot be cancelled by the guest</text>

    <rect x="1000" y="430" width="536" height="132" rx="16" fill="#141418" stroke="rgba(255,94,94,0.35)"/>
    <text x="1020" y="466" fill="#ff5e5e" font-size="11" letter-spacing="1.6">08</text>
    <text x="1020" y="496" fill="#ededed" font-size="16">CANCELLED BY ADMIN</text>
    <text x="1020" y="522" fill="#6f6f69" font-size="13">from draft, awaiting orders, pending, or confirmed</text>
    <text x="1020" y="544" fill="#82827c" font-size="12">terminal · reminders are cancelled with it</text>
  </g>

  <g fill="none" stroke="#6f6f69" stroke-width="1.25" stroke-dasharray="4 5">
    <path d="M780 304 V390 H244 V430" marker-end="url(#arrow-dim)"/>
    <path d="M780 390 H712 V430" marker-end="url(#arrow-dim)"/>
    <path d="M1076 304 V390 H1268 V430" marker-end="url(#arrow-dim)"/>
  </g>
  <text x="796" y="382" fill="#6f6f69" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">exits</text>

  <!-- rejected edge -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="64" y="598" width="1472" height="88" rx="16" fill="#0e0e11" stroke="rgba(255,94,94,0.28)"/>
    <text x="88" y="632" fill="#ff5e5e" font-size="12" letter-spacing="1.4">NOT A TRANSITION</text>
    <text x="88" y="658" fill="#ededed" font-size="15">pending → completed · draft → confirmed · confirmed → pending</text>
    <text x="1188" y="650" fill="#ff5e5e" font-size="13" letter-spacing="0.8">INVALID_TRANSITION</text>
  </g>

  <!-- lock -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="64" y="714" width="1472" height="222" rx="16" fill="#141418" stroke="rgba(214,255,63,0.4)"/>
    <text x="88" y="754" fill="#d6ff3f" font-size="12" letter-spacing="1.8">LOCK, THEN DECIDE</text>
    <text x="88" y="792" fill="#ededed" font-size="18" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="600">The slot row is locked before availability is trusted.</text>
    <text x="88" y="836" fill="#82827c" font-size="14">BEGIN</text>
    <text x="168" y="836" fill="#ededed" font-size="14">SELECT … FROM table_slots WHERE id = $1 FOR UPDATE</text>
    <text x="88" y="864" fill="#82827c" font-size="14">THEN</text>
    <text x="168" y="864" fill="#ededed" font-size="14">count active bookings · insert only if the seat still exists</text>
    <text x="88" y="900" fill="#d6ff3f" font-size="14">The second request waits on that row. It does not see “available”.</text>
  </g>
</svg>
