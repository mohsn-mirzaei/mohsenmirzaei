<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Alexander's Antiques data seam</title>
  <desc id="desc">The storefront and the admin call sixteen repository ports in packages/data. A mock adapter and an HTTP adapter implement the same 83 methods. The HTTP adapter calls the NestJS API, and both sides parse the same Zod schemas from packages/domain.</desc>
  <rect width="1200" height="760" fill="#08080a"/>
  <text x="48" y="56" fill="#d6ff3f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3.2">ONE SEAM</text>
  <text x="48" y="98" fill="#ededed" font-family="ui-sans-serif, system-ui, sans-serif" font-size="32" font-weight="600">Swap the data source. Change no component.</text>
  <text x="48" y="132" fill="#82827c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Both apps shipped on fixtures. The API arrived behind the same ports, and a parity suite counted every method.</text>

  <g fill="none" stroke="#d6ff3f" stroke-width="1.5" opacity="0.85">
    <path d="M312 262 H352"/>
    <path d="M312 452 H352"/>
    <path d="M808 452 H848"/>
  </g>
  <g fill="#d6ff3f">
    <path d="M352 262 l-8 -4.5 v9 z"/>
    <path d="M352 452 l-8 -4.5 v9 z"/>
    <path d="M848 452 l-8 -4.5 v9 z"/>
  </g>
  <g fill="none" stroke="rgba(245,245,240,0.22)" stroke-width="1.2" stroke-dasharray="4 5">
    <path d="M580 586 V630"/>
    <path d="M990 586 V630"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="48" y="176" width="264" height="172" rx="16" fill="#141418" stroke="rgba(245,245,240,0.10)"/>
    <text x="72" y="214" fill="#d6ff3f" font-size="13" letter-spacing="2">01</text>
    <text x="104" y="214" fill="#ededed" font-size="15" letter-spacing="1.4">STOREFRONT</text>
    <text x="72" y="244" fill="#82827c" font-size="12">apps/web &#183; Next.js 16</text>
    <text x="72" y="272" fill="#ededed" font-size="14">catalogue &#183; piece &#183; inquiry</text>
    <text x="72" y="296" fill="#ededed" font-size="14">wishlist &#183; portal &#183; letter</text>
    <text x="72" y="326" fill="#6f6f69" font-size="12">server components first</text>

    <rect x="48" y="366" width="264" height="172" rx="16" fill="#141418" stroke="rgba(245,245,240,0.10)"/>
    <text x="72" y="404" fill="#d6ff3f" font-size="13" letter-spacing="2">02</text>
    <text x="104" y="404" fill="#ededed" font-size="15" letter-spacing="1.4">WORKBENCH</text>
    <text x="72" y="434" fill="#82827c" font-size="12">apps/admin &#183; Vite SPA</text>
    <text x="72" y="462" fill="#ededed" font-size="14">pieces &#183; inquiries &#183; staff</text>
    <text x="72" y="486" fill="#ededed" font-size="14">home page &#183; letter &#183; demand</text>
    <text x="72" y="516" fill="#6f6f69" font-size="12">TanStack Router guards</text>

    <rect x="358" y="176" width="450" height="410" rx="16" fill="#141418" stroke="rgba(214,255,63,0.45)"/>
    <text x="382" y="214" fill="#d6ff3f" font-size="13" letter-spacing="2">03</text>
    <text x="414" y="214" fill="#ededed" font-size="15" letter-spacing="1.4">PORTS</text>
    <text x="382" y="244" fill="#82827c" font-size="12">packages/data &#183; the only door to data</text>

    <rect x="382" y="266" width="402" height="76" rx="12" fill="#0e0e11" stroke="rgba(214,255,63,0.35)"/>
    <text x="402" y="298" fill="#ededed" font-size="22">16 ports &#183; 83 methods</text>
    <text x="402" y="324" fill="#6f6f69" font-size="12">products, inquiries, wishlist, settings, staff, &#8230;</text>

    <rect x="382" y="362" width="190" height="112" rx="12" fill="#0e0e11" stroke="rgba(245,245,240,0.10)"/>
    <text x="400" y="392" fill="#82827c" font-size="12">ADAPTER</text>
    <text x="400" y="420" fill="#ededed" font-size="18">mock</text>
    <text x="400" y="446" fill="#6f6f69" font-size="12">fixtures, same rules</text>
    <text x="400" y="464" fill="#6f6f69" font-size="12">the apps shipped on it</text>

    <rect x="594" y="362" width="190" height="112" rx="12" fill="#0e0e11" stroke="rgba(214,255,63,0.35)"/>
    <text x="612" y="392" fill="#82827c" font-size="12">ADAPTER</text>
    <text x="612" y="420" fill="#d6ff3f" font-size="18">http</text>
    <text x="612" y="446" fill="#6f6f69" font-size="12">Zod-parsed responses</text>
    <text x="612" y="464" fill="#6f6f69" font-size="12">same error codes</text>

    <text x="382" y="518" fill="#82827c" font-size="12">PARITY SUITE</text>
    <text x="382" y="550" fill="#ededed" font-size="22">83 / 83</text>
    <text x="490" y="550" fill="#6f6f69" font-size="12">one assertion per port method</text>

    <rect x="854" y="176" width="298" height="410" rx="16" fill="#141418" stroke="rgba(245,245,240,0.10)"/>
    <text x="878" y="214" fill="#d6ff3f" font-size="13" letter-spacing="2">04</text>
    <text x="910" y="214" fill="#ededed" font-size="15" letter-spacing="1.4">API</text>
    <text x="878" y="244" fill="#82827c" font-size="12">apps/api &#183; NestJS /v1</text>
    <text x="878" y="282" fill="#ededed" font-size="14">138 routes &#183; 32 controllers</text>
    <text x="878" y="314" fill="#ededed" font-size="14">Better Auth &#183; phone OTP</text>
    <text x="878" y="346" fill="#ededed" font-size="14">Postgres &#183; Drizzle</text>
    <text x="878" y="378" fill="#ededed" font-size="14">R2 presign &#8594; PUT &#8594; confirm</text>
    <text x="878" y="410" fill="#ededed" font-size="14">Twilio &#183; Resend &#183; Turnstile</text>
    <text x="878" y="442" fill="#ededed" font-size="14">Redis allowance &#183; Nginx edge</text>
    <text x="878" y="474" fill="#ededed" font-size="14">Pino &#183; OTel &#183; Sentry</text>
    <text x="878" y="530" fill="#82827c" font-size="12">SAME-SITE PROXY</text>
    <text x="878" y="556" fill="#6f6f69" font-size="12">/api/v1 &#8594; one HttpOnly cookie</text>

    <rect x="358" y="630" width="794" height="86" rx="16" fill="#0e0e11" stroke="rgba(214,255,63,0.35)"/>
    <text x="382" y="664" fill="#d6ff3f" font-size="13" letter-spacing="2">05</text>
    <text x="414" y="664" fill="#ededed" font-size="15" letter-spacing="1.4">DOMAIN</text>
    <text x="510" y="664" fill="#82827c" font-size="12">packages/domain &#183; Zod schemas + pure rules returning DomainResult</text>
    <text x="382" y="696" fill="#6f6f69" font-size="12">One definition each side parses. OpenAPI is generated from it, committed, and diffed in CI.</text>

    <text x="48" y="590" fill="#82827c" font-size="12">BOUNDARIES</text>
    <text x="48" y="618" fill="#ededed" font-size="13">apps &#8594; data &#8594; domain</text>
    <text x="48" y="642" fill="#ededed" font-size="13">api &#8594; domain only</text>
    <text x="48" y="666" fill="#6f6f69" font-size="12">enforced by</text>
    <text x="48" y="686" fill="#6f6f69" font-size="12">dependency-cruiser</text>
  </g>
</svg>
